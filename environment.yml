name: local-rag

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.11
  - pip

  - pip:
      # LangChain ecosystem
      - langchain==0.3.25
      - langchain-community==0.3.24
      - langchain-ollama==0.3.2
      - langchain-chroma==0.2.4

      # Vector DB (must satisfy langchain-chroma)
      - chromadb>=1.0.9

      # Parsing
      - pypdf==5.4.0
      - docx2txt==0.8
      - unstructured[md,html]

      # UI
      - streamlit==1.45.0

      # Utilities
      - python-dotenv==1.1.0
      - python-magic==0.4.27